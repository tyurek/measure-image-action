name: Build Container

on:
  push:
    tags:
      - "build-v*"

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          ref: ${{ github.sha }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#build-}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building container for ${VERSION}"

      - name: Log in to Container registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 #v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=long

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f #v3.12.0

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 #v6.18.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest container image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a  # v3.0.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Commit digest update to main
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          # Fork: commit the action.yaml digest update straight to main. Forks can't create
          # PRs with the default GITHUB_TOKEN ("GitHub Actions is not permitted to create or
          # approve pull requests") and don't need the review dance. The sed matches any org
          # so the inherited tinfoilsh reference is rewritten to ${IMAGE_NAME} on first build.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          sed -i "s|ghcr.io/[A-Za-z0-9._-]*/measure-image-action@sha256:[a-f0-9]*|${REGISTRY}/${IMAGE_NAME}@${DIGEST}|" action.yaml
          git add action.yaml
          if git diff --cached --quiet; then
            echo "action.yaml already references ${DIGEST}"
          else
            git commit -m "chore: update container digest for ${VERSION}

          Container digest: ${DIGEST}"
            git push origin main
          fi

      # Fork: upstream triggers release.yml here to cut a versioned action release. For the
      # demo the workload repo pins this action by @main (build.yml already committed the
      # image digest to main), so the versioned-release step — which also can't open PRs and
      # only accepts vX.Y.Z — is dropped.
